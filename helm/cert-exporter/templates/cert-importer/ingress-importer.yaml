apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  annotations: {}
  labels:
    {{ include "cert-exporter.certManagerLabels" . | nindent 4 }}
  name: {{ include "cert-exporter.fullname" . }}-importer
spec:
  rules:
  - host: {{ .Values.certImporter.ingress.host }}
    http:
      paths:
      - backend:
          serviceName: {{ include "cert-exporter.fullname" . }}-importer
          servicePort: http
        path: /

