apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cert-exporter.fullname" . }}-importer
  labels:
    {{ include "cert-exporter.certManagerLabels" . | nindent 4 }}
type: Opaque
data:
  username: {{ default "" .Values.certImporter.credentials.username | b64enc | quote }}
  password: {{ default "" .Values.certImporter.credentials.password | b64enc | quote }}
