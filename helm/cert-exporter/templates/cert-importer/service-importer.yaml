apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-exporter.fullname" . }}-importer
  labels:
    {{ include "cert-exporter.certManagerLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 4500
      name: http
      targetPort: 4500
  selector:
    {{ include "cert-exporter.certManagerSelectorLabels" . | nindent 6 }}
